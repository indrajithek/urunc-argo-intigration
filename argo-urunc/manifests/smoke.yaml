apiVersion: v1
kind: Pod
metadata:
  name: smoke
spec:
  runtimeClassName: urunc
  restartPolicy: Never
  enableServiceLinks: false
  containers:
  - name: main
    image: docker.io/urunc-argo/python-linux-qemu:135
    imagePullPolicy: Never
    command: ["/usr/local/bin/python", "-c", "print(42)"]
