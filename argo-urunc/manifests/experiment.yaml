apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: experiment-
spec:
  entrypoint: demo
  podSpecPatch: '{"runtimeClassName":"urunc","enableServiceLinks":false}'
  templates:
    - name: demo
      script:
        image: docker.io/urunc-argo/python-linux-qemu:135
        imagePullPolicy: Never
        command: [python]
        source: |
          import sys, time
          print("EXPERIMENT-BEGIN", file=sys.stderr, flush=True)
          time.sleep(300)
          print("42")
